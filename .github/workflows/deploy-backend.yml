name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0e4104c34807b3936" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy VAAD backend from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ec2-user bash -lc '\''cd /home/ec2-user/vaad-hcm-platform/server && git pull origin main && pnpm install --frozen-lockfile && pnpm prisma generate && pnpm dotenv -e .env.production -- prisma migrate deploy && pnpm build && pm2 restart vaad-hr-api --update-env'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0e4104c34807b3936" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0e4104c34807b3936" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0e4104c34807b3936" \
                --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1