name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0e4104c34807b3936" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy VAAD backend from GitHub Actions" \
            --parameters 'commands=[
              "cd /home/ec2-user/vaad-hcm-platform/server",
              "git pull origin main",
              "pnpm install --frozen-lockfile",
              "pnpm prisma generate",
              "pnpm dotenv -e .env.production -- prisma migrate deploy",
              "pnpm build",
              "pm2 restart vaad-hr-api --update-env"
            ]'